packages:
  - server
  - web
  # `runner-payload/` is a build-time package, never installed anywhere. It is here so its three
  # dependencies (SDK, zod, undici, all dynamic `import()`) and its `tsc` resolve from its folder,
  # which a folder outside the workspace cannot do. The image reinstalls them with `npm`
  # (session-image/Dockerfile).
  - runner-payload

# pnpm ≥10 blocks postinstall scripts by default: explicit approval.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  "@anthropic-ai/claude-agent-sdk": true
  '@swc/core': true # was Ladle's transpiler; Ladle is gone and it is no longer in the lockfile
  msw: true # was Ladle's network interceptor; now only an optional peer in the lockfile

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.234'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.234'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.234'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.234'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.234'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.234'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.234'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.234'
  - '@anthropic-ai/claude-agent-sdk@0.3.234'
  - '@testing-library/react@16.3.3'

# The two high advisories `make audit-deps` found on 05/09.
#
# fast-uri < 3.1.6 (GHSA-jqff-g426-hqxp, host confusion via percent-encoded scheme normalisation),
# reached through @anthropic-ai/claude-agent-sdk → @modelcontextprotocol/sdk → ajv (and ajv-formats).
# Waiting for upstream would leave the gate red on a fix we do not control. The bound is `^3.1.6`, not
# `>=3.1.6`: ajv declares `fast-uri: ^3.0.1`, and `>=` resolved to 4.1.4, a major jump forced on a
# package that did not ask for it.
#
# drizzle-orm < 0.45.2 (GHSA-gpj5-g38j-94v9, SQL injection through badly escaped identifiers) is ours:
# `server/package.json` declares `^0.44.0`. Checked on 05/09: typecheck and server tests pass on
# 0.45.2. Once server/package.json declares `^0.45.2` itself, this line must go.
#
# Moderate advisories are not forced; `--audit-level=high` lets them through on purpose.
#
# `overrides` lives here, not in package.json: pnpm 11 no longer reads the `pnpm` field there. Put
# there, the override commits and silently does nothing, and the audit stays red (05/09).
overrides:
  fast-uri: '^3.1.6'
  drizzle-orm: '>=0.45.2'
