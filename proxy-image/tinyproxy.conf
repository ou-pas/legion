Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 64
Allow 0.0.0.0/0

Filter "/etc/tinyproxy/allowlist.txt"
FilterType fnmatch
FilterDefaultDeny Yes

# CONNECT (HTTPS) restricted to 443; plain-HTTP proxying (control-plane callbacks)
# is filtered by the same host allowlist.
ConnectPort 443
# 22: git over SSH behind the wall (v40). The host filter above applies to CONNECT too, so only
# an already allowed host becomes reachable, and only on this port. Without it, SSH would be a
# dead end in a restricted environment and the fix would be widening the network instead.
ConnectPort 22
